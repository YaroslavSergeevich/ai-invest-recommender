version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-invest-recommender-postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  analyser:
    build:
      context: ./analyser
      dockerfile: Dockerfile
    container_name: ai-invest-recommender-analyser
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-invest-recommender-backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      analyser:
        condition: service_healthy

  news-listener:
    build:
      context: ./news-listener
      dockerfile: Dockerfile
    container_name: ai-invest-recommender-news-listener
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ""
        VITE_USE_MOCK: ${VITE_USE_MOCK:-auto}
        VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-production}
        VITE_FRONTEND_VERSION: ${VITE_FRONTEND_VERSION:-1.0.0}
    container_name: ai-invest-recommender-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: