  # Открытые API / справочные данные. Эти endpoints возвращают данные,
  # а не обязательно новостные статьи; используйте отдельную обработку по типу API.
  - name: "CBR_KeyRate"
    type: "api"
    url: "https://www.cbr.ru/DailyInfoWebServ/DailyInfo.asmx"
    schedule: "0 */6 * * *"
    headers:
      "Accept": "application/json, application/xml, text/xml"
    pdf: false

  - name: "CBR_ExchangeRates"
    type: "api"
    url: "https://www.cbr-xml-daily.ru/daily_json.js"
    schedule: "0 * * * *"
    headers:
      "Accept": "application/json"
    pdf: false

  - name: "MOEX_Securities"
    type: "api"
