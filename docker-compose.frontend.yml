services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
        VITE_USE_MOCK: ${VITE_USE_MOCK:-auto}
        VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-production}
        VITE_FRONTEND_VERSION: ${VITE_FRONTEND_VERSION:-1.0.0}
    container_name: biz-analytics-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
