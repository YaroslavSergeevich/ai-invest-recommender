  - name: "Eurostat_Indicators"
    type: "api"
    url: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/nama_10_gdp?geo=EU27_2020"
    schedule: "0 6,18 * * *"
    headers:
      "Accept": "application/json"
    pdf: false

  - name: "WorldBank_Indicators"
