  # Региональные порталы: федеральные округа РФ.
  # CSS-селекторы являются стартовыми шаблонами и должны быть проверены
  # на актуальной вёрстке сайта перед эксплуатацией.
  - name: "MSK_Agency"
    type: "html"
    url: "https://www.mskagency.ru/"
    schedule: "0 */2 * * *"
    list_selector: "article, .news-item, .article-item"
    link_selector: "a[href]"
    title_selector: "h1, h2, h3, .title"
    date_selector: "time[datetime], .date, .published"
    selector: "article, .article-text, .text, main"
    pdf: false

  - name: "Fontanka"
